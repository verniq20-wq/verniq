name: Android APK

# Builds the Verniq Android app on every push to main.
# Download the APK from the run's "Artifacts" section, or from the
# "android-latest" release on the repository's Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../verniq.apk

      - uses: actions/upload-artifact@v4
        with:
          name: verniq-android
          path: verniq.apk

      - name: Publish to "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Verniq Android (latest)
          prerelease: true
          files: verniq.apk
          body: |
            Latest Android build of Verniq from `main`.
            Install `verniq.apk` on an Android phone or tablet (allow "Install unknown apps" when asked).
